<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rusty Player</title>
    <link rel="stylesheet" href="/player.css" />
</head>
<body>
    <div class="player" id="player">
        <video id="video" preload="metadata" data-src="{url}"></video>
        <audio id="audio" preload="auto"></audio>
        <div class="loading-spinner" id="loading-spinner" aria-hidden="true">
            <div class="spinner"></div>
        </div>
        <div class="mini-seekbar" id="mini-seekbar">
            <div class="mini-seekbar-buffer" id="mini-buffer"></div>
            <div class="mini-seekbar-progress" id="mini-progress"></div>
        </div>
        <div class="preview" id="preview">
            <div class="preview-strip" id="preview-strip">
            </div>
            <div class="preview-time" id="preview-time">0:00</div>
        </div>
        <div class="debug-panel" id="debug-panel">
            <div>NET: <span id="dbg-net">-</span></div>
            <div>READY: <span id="dbg-ready">-</span> / STATE: <span id="dbg-state">-</span></div>
            <div>TIME: <span id="dbg-time">0:00</span> / <span id="dbg-dur">0:00</span></div>
            <div>RATE: <span id="dbg-playrate">1x</span> / VOL: <span id="dbg-vol">100%</span> <span id="dbg-muted">on</span></div>
            <div>SIZE: <span id="dbg-size">-</span></div>
            <div>FRAMES: <span id="dbg-frames">0</span> / DROP: <span id="dbg-drop">0</span></div>
            <div>BUF: <span id="dbg-buffer">0%</span></div>
            <div class="debug-bar"><div class="debug-bar-fill" id="dbg-buffer-bar"></div></div>
            <div>BUF-R: <span id="dbg-bufrange">-</span></div>
            <div>RATE: <span id="dbg-rate">0 KB/s</span></div>
        </div>
        <div class="controls is-visible" id="controls">
            <div class="center-control">
                <button class="center-button" id="center-play" title="再生/一時停止">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
            <div class="bottom-controls">
                <div class="seekbar">
                    <div class="seekbar-container" id="seekbar">
                        <div class="seekbar-buffer" id="buffer"></div>
                        <div class="seekbar-progress" id="progress"></div>
                        <div class="seekbar-handle" id="handle"></div>
                        <div class="seekbar-tooltip" id="tooltip">00:00</div>
                    </div>
                </div>
                <div class="control-bar">
                    <div class="control-group">
                        <button class="icon-button" id="play-pause">
                            <svg class="small-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="icon-button" id="mute-btn">
                            <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <div class="volume-container">
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                        </div>
                        <div class="time-display">
                            <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="tool-group">
                            <button class="speed-button" id="speed-btn" title="再生速度">1x</button>
                            <button class="speed-button" id="quality-btn" title="画質">Auto</button>
                            <button class="icon-button" id="pip-btn" title="ピクチャーインピクチャー">
                                <svg viewBox="0 0 24 24"><path d="M19 7H5c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h4v-2H5V9h14v6h-5v2h5c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-3 4h-6v4h6v-4z"/></svg>
                            </button>
                            <button class="icon-button" id="cast-btn" title="キャスト">
                                <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-2H3c-1.1 0-2 .9-2 2v2h2V8h18v10h-7v2h7c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
                            </button>
                        </div>
                        <button class="icon-button" id="fullscreen-btn">
                            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                        <div class="speed-menu" id="speed-menu">
                            <div class="speed-row">
                                <input class="speed-range" id="speed-range" type="range" min="0.25" max="3" step="0.05" value="1" />
                                <input class="speed-input" id="speed-input" type="number" min="0.25" max="3" step="0.05" value="1" />
                            </div>
                            <div class="speed-presets">
                                <button class="speed-chip" data-rate="0.5">0.5x</button>
                                <button class="speed-chip" data-rate="0.75">0.75x</button>
                                <button class="speed-chip" data-rate="1">1x</button>
                                <button class="speed-chip" data-rate="1.25">1.25x</button>
                                <button class="speed-chip" data-rate="1.5">1.5x</button>
                                <button class="speed-chip" data-rate="2">2x</button>
                                <button class="speed-chip" data-rate="2.5">2.5x</button>
                                <button class="speed-chip" data-rate="3">3x</button>
                            </div>
                        </div>
                        <div class="quality-menu" id="quality-menu"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/player.js"></script>
</body>
</html>
